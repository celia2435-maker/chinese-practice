<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生字筆順練習 · 闖關遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font-ui: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-char: "標楷體", "DFKai-SB", "BiauKai", "Kaiti TC", "Noto Serif CJK TC", "PMingLiU", serif;
    --font-display: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PingFang TC", serif;

    --bg-1: #FBF6EC;
    --bg-2: #F5ECD9;
    --paper: #FFFFFF;
    --paper-tint: #FDF8EF;

    --ink: #2B2620;
    --ink-soft: #595247;
    --ink-mute: #938871;

    --primary: #B23A2F;
    --primary-dark: #8B2A22;
    --primary-soft: #D45444;
    --primary-tint: #FCEAE5;

    --gold: #BE9552;
    --gold-dark: #9B7937;
    --gold-tint: #F5E8CF;

    --sage: #5F8463;
    --sage-tint: #DCE8DC;

    --indigo: #3F5B89;

    --line: rgba(43, 38, 32, 0.08);
    --line-soft: rgba(43, 38, 32, 0.04);

    --sh-xs: 0 1px 2px rgba(43, 38, 32, 0.04);
    --sh-sm: 0 2px 6px rgba(43, 38, 32, 0.06), 0 1px 2px rgba(43, 38, 32, 0.04);
    --sh-md: 0 6px 18px rgba(43, 38, 32, 0.08), 0 2px 4px rgba(43, 38, 32, 0.04);
    --sh-lg: 0 14px 36px rgba(43, 38, 32, 0.10), 0 4px 8px rgba(43, 38, 32, 0.04);

    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 28px;
    --r-pill: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-ui);
    background:
      radial-gradient(circle at 10% 0%, var(--gold-tint) 0, transparent 40%),
      radial-gradient(circle at 90% 100%, var(--primary-tint) 0, transparent 50%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }
  .container { max-width: 1040px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  .ornament {
    display: inline-flex; align-items: center; gap: 14px;
    margin-bottom: 8px; color: var(--gold-dark);
  }
  .ornament::before, .ornament::after {
    content: ''; width: 36px; height: 1px;
    background: currentColor; opacity: 0.6;
  }
  .ornament span { font-size: 11px; letter-spacing: 6px; font-weight: 500; text-transform: uppercase; }
  h1 {
    color: var(--primary);
    font-size: 34px; font-weight: 900;
    letter-spacing: 6px; margin: 2px 0 4px;
    font-family: var(--font-char);
  }
  .subtitle { color: var(--ink-mute); font-size: 13px; letter-spacing: 2px; font-weight: 400; }

  .tabs-wrap { text-align: center; margin-bottom: 28px; }
  .tabs {
    display: inline-flex; gap: 4px; padding: 5px;
    background: var(--paper); border-radius: var(--r-pill);
    box-shadow: var(--sh-sm);
  }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; background: transparent; border: none;
    border-radius: var(--r-pill); font-family: var(--font-ui);
    font-size: 15px; font-weight: 500; cursor: pointer;
    color: var(--ink-soft); transition: all 0.2s ease;
  }
  .tab .ico { font-size: 16px; }
  .tab:hover { color: var(--primary); }
  .tab.active {
    background: var(--primary); color: white; font-weight: 700;
    box-shadow: 0 2px 8px rgba(178, 58, 47, 0.25);
  }

  .search-bar { position: relative; max-width: 380px; margin: 0 auto 28px; }
  .search-bar input {
    width: 100%; padding: 14px 56px 14px 22px; font-size: 20px;
    border: 1.5px solid var(--line); border-radius: var(--r-pill);
    outline: none; text-align: center; font-family: var(--font-char);
    background: var(--paper); color: var(--ink);
    box-shadow: var(--sh-sm); transition: all 0.2s;
  }
  .search-bar input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-tint), var(--sh-sm);
  }
  .search-bar input::placeholder {
    font-family: var(--font-ui); font-size: 15px;
    color: var(--ink-mute); font-weight: 400;
  }
  .search-bar button {
    position: absolute; right: 5px; top: 50%;
    transform: translateY(-50%); width: 42px; height: 42px; padding: 0;
    background: var(--primary); color: white; border: none;
    border-radius: 50%; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .search-bar button:hover { background: var(--primary-dark); transform: translateY(-50%) scale(1.05); }

  .selector {
    background: var(--paper); border-radius: var(--r-lg);
    box-shadow: var(--sh-sm); padding: 20px 22px;
    border: 1px solid var(--line-soft); margin-bottom: 22px;
  }
  .selector-row {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px; align-items: center;
  }
  .selector-row:last-child { margin-bottom: 0; }
  .selector-label {
    font-weight: 700; color: var(--ink); min-width: 50px;
    font-size: 13px; letter-spacing: 1px; opacity: 0.7;
  }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .btn {
    padding: 8px 16px; background: var(--paper-tint);
    border: 1.5px solid var(--line); border-radius: var(--r-pill);
    cursor: pointer; font-family: var(--font-ui);
    font-size: 14px; font-weight: 500; color: var(--ink-soft);
    transition: all 0.15s;
  }
  .btn:hover {
    background: var(--primary-tint); border-color: var(--primary-soft);
    color: var(--primary);
  }
  .btn.active {
    background: var(--primary); color: white; border-color: var(--primary);
    font-weight: 700; box-shadow: 0 2px 6px rgba(178, 58, 47, 0.22);
  }

  .lessons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 14px;
  }
  .lesson-card {
    background: var(--paper); padding: 18px 20px;
    border-radius: var(--r-lg); cursor: pointer;
    border: 1px solid var(--line-soft); transition: all 0.2s ease;
    box-shadow: var(--sh-xs); position: relative; overflow: hidden;
  }
  .lesson-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--gold); opacity: 0;
    transition: opacity 0.2s;
  }
  .lesson-card:hover {
    border-color: transparent; transform: translateY(-3px);
    box-shadow: var(--sh-md);
  }
  .lesson-card:hover::before { opacity: 1; }
  .lesson-meta {
    color: var(--gold-dark); font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .lesson-meta::after {
    content: ''; flex: 1; height: 1px;
    background: var(--gold-tint); opacity: 0.6;
  }
  .lesson-name {
    font-size: 20px; margin: 10px 0 12px;
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: 1.5px;
    line-height: 1.35;
  }
  .lesson-count {
    font-size: 12px; color: var(--ink-mute);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: var(--paper-tint);
    border-radius: var(--r-pill); font-weight: 500;
  }

  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 10px;
  }
  .char-item {
    aspect-ratio: 1; background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; cursor: pointer; transition: all 0.15s ease;
    user-select: none; font-family: var(--font-char);
    color: var(--ink); box-shadow: var(--sh-xs);
  }
  .char-item:hover {
    border-color: var(--primary); background: var(--primary-tint);
    transform: scale(1.08) translateY(-2px);
    box-shadow: var(--sh-md); color: var(--primary-dark);
  }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; background: var(--paper);
    border: 1.5px solid var(--line); color: var(--ink-soft);
    border-radius: var(--r-pill); cursor: pointer;
    font-family: var(--font-ui); font-size: 14px; font-weight: 500;
    margin-bottom: 18px; transition: all 0.15s; box-shadow: var(--sh-xs);
  }
  .back-btn:hover {
    border-color: var(--primary); color: var(--primary);
    background: var(--primary-tint);
  }

  .page-title {
    color: var(--ink); font-size: 20px; font-weight: 700;
    margin-bottom: 18px;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .page-title .crumb {
    color: var(--gold-dark); font-size: 12px;
    letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase;
  }
  .page-title .name-part {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    color: var(--primary);
    letter-spacing: 1.5px;
  }

  .char-detail { text-align: center; padding-top: 4px; }
  .char-info {
    font-size: 16px; color: var(--ink-soft);
    margin-bottom: 4px;
    font-family: var(--font-display);
    letter-spacing: 1px;
  }
  .char-info .idx {
    color: var(--primary); font-weight: 700; font-family: var(--font-ui);
  }
  .char-zhuyin-display {
    font-size: 18px; color: var(--ink-mute); margin-bottom: 20px;
    letter-spacing: 1px; font-family: var(--font-char);
  }
  .char-zhuyin-display .label {
    font-family: var(--font-ui); font-size: 12px; letter-spacing: 1.5px;
    color: var(--gold-dark); font-weight: 700;
    margin-right: 6px; text-transform: uppercase;
  }
  .writer-wrap {
    display: inline-block; background: var(--paper);
    padding: 20px; border-radius: var(--r-xl);
    box-shadow: var(--sh-lg); margin-bottom: 24px;
    border: 1px solid var(--line-soft);
  }
  #writer-target, #game-writer-target {
    display: block; margin: 0 auto; border-radius: var(--r-md);
  }

  .controls {
    display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .control-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 12px 24px; font-size: 15px; font-weight: 700;
    border: none; border-radius: var(--r-pill);
    cursor: pointer; font-family: var(--font-ui);
    color: white; transition: all 0.15s; box-shadow: var(--sh-sm);
  }
  .control-btn:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
  .control-btn:active { transform: translateY(0); }
  .btn-play { background: linear-gradient(135deg, var(--sage) 0%, #7AAB7F 100%); }
  .btn-quiz { background: linear-gradient(135deg, var(--gold) 0%, #D4AC6B 100%); }
  .btn-reset { background: linear-gradient(135deg, var(--indigo) 0%, #5878A6 100%); }
  .btn-skip { background: linear-gradient(135deg, #95a5a6 0%, #AFB8B9 100%); }
  .btn-hint { background: linear-gradient(135deg, #8E6BA6 0%, #A784BE 100%); }

  .hint {
    text-align: center; color: var(--ink-mute);
    margin: 0 auto 12px; font-size: 13px;
    max-width: 480px; line-height: 1.6;
  }
  .nav-bar {
    display: flex; justify-content: center; gap: 10px;
    margin-top: 20px; max-width: 420px;
    margin-left: auto; margin-right: auto;
  }
  .nav-btn {
    flex: 1; padding: 12px 20px; background: var(--paper);
    border: 1.5px solid var(--line); color: var(--ink-soft);
    border-radius: var(--r-pill); cursor: pointer;
    font-family: var(--font-ui); font-size: 14px; font-weight: 500;
    transition: all 0.15s; box-shadow: var(--sh-xs);
  }
  .nav-btn:hover {
    border-color: var(--primary); color: var(--primary);
    background: var(--primary-tint);
  }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn:disabled:hover {
    border-color: var(--line); color: var(--ink-soft); background: var(--paper);
  }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .game-setup {
    background: var(--paper); padding: 32px 30px;
    border-radius: var(--r-xl); box-shadow: var(--sh-md);
    max-width: 700px; margin: 0 auto;
    border: 1px solid var(--line-soft);
  }
  .game-setup h2 {
    color: var(--primary); font-size: 22px;
    margin-bottom: 4px; text-align: center;
    font-weight: 700; letter-spacing: 2px;
  }
  .game-setup-sub {
    color: var(--ink-mute); font-size: 13px;
    text-align: center; margin-bottom: 28px; letter-spacing: 1px;
  }
  .setup-section {
    margin-bottom: 22px; padding-bottom: 22px;
    border-bottom: 1px solid var(--line-soft);
  }
  .setup-section:last-of-type { border-bottom: none; padding-bottom: 0; }
  .setup-label {
    font-weight: 700; color: var(--ink);
    margin-bottom: 12px; font-size: 13px;
    letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .setup-label .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; background: var(--gold-tint);
    color: var(--gold-dark); border-radius: 50%;
    font-size: 11px; font-weight: 900;
  }
  .setup-hint-text {
    font-size: 11px; color: var(--ink-mute);
    font-weight: 400; margin-left: 4px;
    letter-spacing: 0.5px; text-transform: none;
  }
  .pool-info {
    text-align: center; color: var(--ink-soft); font-size: 13px;
    margin: 20px 0 16px; padding: 12px 16px;
    background: var(--gold-tint); border-radius: var(--r-md);
    font-weight: 500; letter-spacing: 0.5px;
  }
  .pool-info strong {
    color: var(--gold-dark); font-size: 16px;
    font-weight: 900; margin: 0 4px;
  }
  .start-btn {
    display: block; width: 100%; padding: 18px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-soft) 100%);
    color: white; border: none; border-radius: var(--r-pill);
    font-size: 18px; font-weight: 700; font-family: var(--font-ui);
    cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 6px 20px rgba(178,58,47,0.25);
    transition: all 0.2s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(178,58,47,0.35); }
  .start-btn:disabled {
    background: #cfcfcf; cursor: not-allowed;
    transform: none; box-shadow: none; letter-spacing: 1px;
  }

  .game-play { text-align: center; padding-top: 4px; max-width: 560px; margin: 0 auto; }
  .game-topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin: 0 auto 14px; gap: 14px;
  }
  .progress-box {
    background: var(--paper); padding: 10px 20px;
    border-radius: var(--r-pill); box-shadow: var(--sh-sm);
    font-weight: 500; font-size: 13px;
    color: var(--ink-soft); letter-spacing: 0.5px;
  }
  .progress-box .num {
    color: var(--primary); font-weight: 900;
    font-size: 18px; margin: 0 3px; font-family: var(--font-ui);
  }
  .score-box {
    background: linear-gradient(135deg, var(--sage) 0%, #7AAB7F 100%);
    color: white; padding: 10px 22px; border-radius: var(--r-pill);
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
    box-shadow: 0 3px 10px rgba(95, 132, 99, 0.25);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .score-box .score-num { font-size: 18px; margin: 0 2px; font-weight: 900; }

  .progress-track {
    height: 6px; background: var(--paper);
    border-radius: var(--r-pill); overflow: hidden;
    margin-bottom: 20px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold) 0%, var(--primary-soft) 100%);
    border-radius: var(--r-pill); transition: width 0.4s ease;
  }

  .zhuyin-card {
    background: linear-gradient(135deg, var(--paper) 0%, var(--paper-tint) 100%);
    padding: 24px 20px 20px; border-radius: var(--r-lg);
    box-shadow: var(--sh-md); margin-bottom: 20px;
    border: 1px solid var(--line-soft);
  }
  .zhuyin-card .label {
    color: var(--gold-dark); font-size: 11px;
    letter-spacing: 3px; font-weight: 700; margin-bottom: 10px;
  }
  .zhuyin-clue {
    font-family: var(--font-char); font-size: 54px;
    color: var(--primary); font-weight: 700;
    letter-spacing: 10px; line-height: 1.1;
  }
  .clue-hint {
    color: var(--ink-mute); font-size: 13px;
    margin-top: 12px; letter-spacing: 1px;
  }

  .game-result {
    background: var(--paper); padding: 40px 30px 30px;
    border-radius: var(--r-xl); box-shadow: var(--sh-lg);
    max-width: 720px; margin: 0 auto; text-align: center;
    border: 1px solid var(--line-soft);
  }
  .result-emoji {
    font-size: 72px; margin-bottom: 8px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
  }
  .result-title {
    font-size: 26px; font-weight: 900; color: var(--ink);
    margin-bottom: 8px; letter-spacing: 2px;
  }
  .result-score { font-size: 16px; color: var(--ink-soft); margin-bottom: 8px; }
  .result-score .big {
    font-size: 60px; font-weight: 900;
    background: linear-gradient(135deg, var(--sage) 0%, #7AAB7F 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0 4px; font-family: var(--font-ui);
    line-height: 1; display: inline-block; vertical-align: middle;
  }
  .result-percentage {
    font-size: 13px; color: var(--ink-mute); letter-spacing: 1px;
    margin: 12px 0 24px; padding: 10px;
    background: var(--paper-tint); border-radius: var(--r-md);
    display: inline-block; min-width: 280px;
  }
  .result-divider {
    text-align: center; color: var(--ink-mute); font-size: 12px;
    letter-spacing: 3px; margin: 4px 0 18px;
    font-weight: 700; position: relative;
  }
  .result-divider::before, .result-divider::after {
    content: ''; position: absolute; top: 50%;
    width: 60px; height: 1px; background: var(--line);
  }
  .result-divider::before { left: calc(50% - 130px); }
  .result-divider::after { right: calc(50% - 130px); }
  .result-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 10px; margin-bottom: 28px;
  }
  .result-item {
    aspect-ratio: 1; border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-family: var(--font-char);
    position: relative; border: 2px solid; transition: transform 0.15s;
  }
  .result-item:hover { transform: scale(1.08); }
  .result-item.ok { background: var(--sage-tint); border-color: var(--sage); color: #2D5733; }
  .result-item.wrong { background: #FBE2DE; border-color: #D86352; color: #7D2015; }
  .result-item.skip { background: #F0ECE2; border-color: var(--ink-mute); color: var(--ink-soft); }
  .result-item .badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 22px; height: 22px; padding: 0 4px;
    border-radius: var(--r-pill);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: white; font-weight: 700;
    font-family: var(--font-ui); box-shadow: var(--sh-sm);
  }
  .result-item.ok .badge { background: var(--sage); }
  .result-item.wrong .badge { background: #D86352; }
  .result-item.skip .badge { background: var(--ink-mute); }

  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .celebration {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--paper); padding: 24px 42px;
    border-radius: var(--r-xl);
    box-shadow: 0 20px 50px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.08);
    font-size: 28px; color: var(--sage);
    text-align: center; z-index: 100; display: none;
    font-weight: 700; letter-spacing: 2px;
    border: 1px solid var(--line-soft);
  }
  .celebration.show { display: block; animation: pop 0.5s ease; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.5) rotate(-6deg); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  }

  .error-msg {
    text-align: center; color: var(--primary); padding: 24px;
    font-size: 14px; background: var(--primary-tint);
    border-radius: var(--r-md); line-height: 1.6;
  }

  /* SVG icon */
  .ico {
    display: inline-block;
    width: 1.1em; height: 1.1em;
    vertical-align: -0.2em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ico-fill { fill: currentColor; stroke: none; }
  .ico-sm { width: 0.95em; height: 0.95em; vertical-align: -0.15em; }
  .control-btn .ico { margin-right: 2px; }

  /* 結果印章 */
  .result-seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 112px; height: 112px;
    border-radius: 50%;
    position: relative;
    margin-bottom: 14px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
  }
  .result-seal::before {
    content: '';
    position: absolute; inset: 7px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
  }
  .result-seal .seal-char {
    font-family: var(--font-char);
    font-weight: 700;
    font-size: 58px;
    line-height: 1;
    color: white;
    letter-spacing: -2px;
    position: relative; z-index: 1;
  }
  .seal-top { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); }
  .seal-excellent { background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 100%); }
  .seal-good { background: linear-gradient(135deg, #4A7050 0%, var(--sage) 100%); }
  .seal-ok { background: linear-gradient(135deg, var(--indigo) 0%, #5B7AB0 100%); }
  .seal-practice { background: linear-gradient(135deg, var(--ink-soft) 0%, var(--ink-mute) 100%); }

  .result-item .badge {
    font-family: var(--font-char);
    font-size: 13px;
    font-weight: 700;
    min-width: 22px; height: 22px; padding: 0 5px;
  }

  .lesson-count .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 4px;
    vertical-align: 2px;
  }

  @media (max-width: 560px) {
    body { padding: 18px 12px 50px; }
    h1 { font-size: 26px; letter-spacing: 3px; }
    .subtitle { font-size: 11px; }
    .tab { padding: 8px 16px; font-size: 13px; }
    .tab .ico { font-size: 14px; }
    .search-bar input { font-size: 18px; padding: 12px 50px 12px 18px; }
    .search-bar button { width: 36px; height: 36px; font-size: 15px; }
    .selector { padding: 16px; }
    .selector-label { min-width: auto; width: 100%; margin-bottom: 4px; }
    .lessons { grid-template-columns: 1fr; }
    .lesson-name { font-size: 18px; }
    .char-item { font-size: 30px; }
    .char-grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
    .zhuyin-clue { font-size: 40px; letter-spacing: 5px; }
    .zhuyin-card { padding: 18px 14px; }
    .game-setup { padding: 24px 18px; }
    .result-emoji { font-size: 56px; }
    .result-title { font-size: 20px; }
    .result-score .big { font-size: 46px; }
    .result-item { font-size: 26px; }
    .result-list { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
    .control-btn { padding: 10px 18px; font-size: 14px; }
    .result-divider::before, .result-divider::after { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="ornament"><span>Chinese Characters</span></div>
    <h1>生字筆順練習</h1>
    <p class="subtitle">看動畫 · 自己寫 · 闖關遊戲</p>
  </header>

  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" data-mode="browse" onclick="switchMode('browse')">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v16H6.5a2.5 2.5 0 0 0 0 5H20"/><path d="M8 7h8M8 11h6"/></svg>
        瀏覽練習
      </button>
      <button class="tab" data-mode="game" onclick="switchMode('game')">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8 11v2M7 12h2M15 12h.01M17 14h.01"/></svg>
        闖關遊戲
      </button>
    </div>
  </div>

  <div id="mode-browse" class="mode-view">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="搜尋任何中文字" maxlength="1" onkeyup="if(event.key==='Enter')searchChar()">
      <button onclick="searchChar()" aria-label="搜尋">
        <svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:middle;"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
    </div>

    <div id="browse-view" class="view active">
      <div class="selector">
        <div class="selector-row">
          <span class="selector-label">版本</span>
          <div id="pub-buttons" class="btn-row"></div>
        </div>
        <div class="selector-row">
          <span class="selector-label">年級</span>
          <div id="grade-buttons" class="btn-row"></div>
        </div>
      </div>
      <div id="lessons" class="lessons"></div>
    </div>

    <div id="chars-view" class="view">
      <button class="back-btn" onclick="switchView('browse-view')">
        <svg class="ico ico-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回課別
      </button>
      <h2 id="chars-title" class="page-title"></h2>
      <div id="char-grid" class="char-grid"></div>
    </div>

    <div id="char-view" class="view">
      <button class="back-btn" onclick="backToChars()">
        <svg class="ico ico-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回生字
      </button>
      <div class="char-detail">
        <div class="char-info" id="char-info"></div>
        <div class="char-zhuyin-display" id="char-zhuyin-display"></div>
        <div class="writer-wrap">
          <div id="writer-target"></div>
        </div>
        <div class="controls">
          <button class="control-btn btn-play" onclick="playAnimation()">
            <svg class="ico ico-fill" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            看筆順
          </button>
          <button class="control-btn btn-quiz" onclick="startQuiz()">
            <svg class="ico" viewBox="0 0 24 24"><path d="M17 3l4 4-11 11-5 1 1-5z"/><path d="M14 6l4 4"/></svg>
            自己寫
          </button>
          <button class="control-btn btn-reset" onclick="resetChar()">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><polyline points="3 21 3 16 8 16"/></svg>
            重來
          </button>
        </div>
        <div class="hint">「看筆順」:動畫示範寫法 · 「自己寫」:照筆順用手指或滑鼠描</div>
        <div class="nav-bar">
          <button class="nav-btn" id="prev-btn" onclick="prevChar()">
            <svg class="ico ico-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            上一字
          </button>
          <button class="nav-btn" id="next-btn" onclick="nextChar()">
            下一字
            <svg class="ico ico-sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="mode-game" class="mode-view" style="display:none;">
    <div id="game-setup-view" class="view active">
      <div class="game-setup">
        <h2>闖&nbsp;&nbsp;關&nbsp;&nbsp;設&nbsp;&nbsp;定</h2>
        <div class="game-setup-sub">選好條件,系統隨機出題</div>

        <div class="setup-section">
          <div class="setup-label"><span class="num">1</span>版本 <span class="setup-hint-text">(可複選)</span></div>
          <div id="g-pub-buttons" class="btn-row"></div>
        </div>

        <div class="setup-section">
          <div class="setup-label"><span class="num">2</span>年級 <span class="setup-hint-text">(可複選)</span></div>
          <div id="g-grade-buttons" class="btn-row"></div>
        </div>

        <div class="setup-section">
          <div class="setup-label"><span class="num">3</span>課別範圍</div>
          <div id="g-lesson-buttons" class="btn-row"></div>
        </div>

        <div class="setup-section">
          <div class="setup-label"><span class="num">4</span>題數</div>
          <div class="btn-row" id="g-count-buttons">
            <button class="btn count-btn active" data-count="5">5 題</button>
            <button class="btn count-btn" data-count="10">10 題</button>
            <button class="btn count-btn" data-count="20">20 題</button>
            <button class="btn count-btn" data-count="30">30 題</button>
          </div>
        </div>

        <div class="pool-info" id="g-pool-info">
          符合條件的生字 <strong id="g-pool-count">—</strong> 個
        </div>

        <button class="start-btn" id="g-start-btn" onclick="startGame()">開始闖關</button>
      </div>
    </div>

    <div id="game-play-view" class="view">
      <div class="game-play">
        <div class="game-topbar">
          <div class="progress-box">第 <span class="num" id="g-current">1</span>/<span id="g-total">10</span> 題</div>
          <div class="score-box">答對 <span class="score-num" id="g-score">0</span> 題</div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="g-progress-fill" style="width:0%;"></div></div>

        <div class="zhuyin-card">
          <div class="label">題目 · ZHUYIN</div>
          <div class="zhuyin-clue" id="g-zhuyin">ㄓㄥˋ</div>
          <div class="clue-hint">請照注音寫出這個字的筆順</div>
        </div>

        <div class="writer-wrap">
          <div id="game-writer-target"></div>
        </div>
        <div class="controls">
          <button class="control-btn btn-hint" onclick="peekAnswer()">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.6c.6.5 1 1.3 1 2.1V18h6v-1.3c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/><path d="M9 21h6M10 24h4"/></svg>
            看一下答案
          </button>
          <button class="control-btn btn-skip" onclick="skipQuestion()">
            <svg class="ico ico-fill" viewBox="0 0 24 24"><path d="M5 5l9 7-9 7z"/><rect x="16" y="5" width="3" height="14" rx="0.5"/></svg>
            跳過
          </button>
        </div>
        <div class="hint">錯 3 次會自動提示下一筆的位置</div>
      </div>
    </div>

    <div id="game-result-view" class="view">
      <div class="game-result">
        <div class="result-seal seal-good" id="g-seal"><span class="seal-char" id="g-seal-char">良</span></div>
        <div class="result-title" id="g-result-title">完成了</div>
        <div class="result-score">答對 <span class="big" id="g-correct">0</span> / <span id="g-of">0</span> 題</div>
        <div class="result-percentage" id="g-percentage">答對率 0%</div>
        <div class="result-divider">各題結果</div>
        <div class="result-list" id="g-result-list"></div>
        <div class="result-actions">
          <button class="control-btn btn-reset" onclick="restartGame()">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><polyline points="3 21 3 16 8 16"/></svg>
            再玩一次
          </button>
          <button class="control-btn btn-skip" onclick="backToSetup()">
            <svg class="ico ico-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            重新設定
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="celebration" class="celebration">答 對 了</div>

// 年級排序:國小 1→6 國中 1→3
function sortGrades(grades) {
  return grades.slice().sort((a, b) => {
    const rank = x => (x.startsWith('國小') ? 0 : 100) + parseInt(x.match(/\d+/)[0]);
    return rank(a) - rank(b);
  });
}

let state = {
  pub: null, grade: null, lesson: null,
  chars: [], charIdx: 0, writer: null,
  game: {
    pubs: new Set(), grades: new Set(),
    lessonFilter: 'all',
    count: 5,
    queue: [], results: [], curIdx: 0,
    mistakes: 0, revealed: false, writer: null
  }
};

function loadCharData(ch, onOk, onErr) {
  fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${ch}.json`)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(onOk)
    .catch(onErr);
}

function initBrowse() {
  const pubs = Object.keys(DATA);
  document.getElementById('pub-buttons').innerHTML =
    pubs.map(p => `<button class="btn pub-btn" data-pub="${p}">${p}</button>`).join('');
  document.querySelectorAll('.pub-btn').forEach(b => {
    b.onclick = () => selectPub(b.dataset.pub);
  });
  selectPub(pubs[0]);
}

function selectPub(pub) {
  state.pub = pub;
  document.querySelectorAll('.pub-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.pub === pub);
  });
  const grades = sortGrades(Object.keys(DATA[pub]));
  document.getElementById('grade-buttons').innerHTML =
    grades.map(g => `<button class="btn grade-btn" data-g="${g}">${g}</button>`).join('');
  document.querySelectorAll('.grade-btn').forEach(b => {
    b.onclick = () => selectGrade(b.dataset.g);
  });
  selectGrade(grades[0]);
}

function selectGrade(g) {
  state.grade = g;
  document.querySelectorAll('.grade-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.g === g);
  });
  renderLessons();
}

function renderLessons() {
  const lessons = DATA[state.pub][state.grade] || [];
  document.getElementById('lessons').innerHTML = lessons.map((l, i) => `
    <div class="lesson-card" onclick="showLesson(${i})">
      <div class="lesson-meta">第 ${l.lesson} 課 · ${l.sem}學期 · 第 ${l.book} 冊</div>
      <div class="lesson-name">${l.name}</div>
      <div class="lesson-count"><span class="dot"></span>共 ${l.chars.length} 字</div>
    </div>
  `).join('');
}

function showLesson(idx) {
  const lesson = DATA[state.pub][state.grade][idx];
  state.chars = lesson.chars;
  state.lesson = lesson;
  state.charIdx = 0;
  document.getElementById('chars-title').innerHTML =
    `<span class="crumb">${state.pub} · ${state.grade} · 第 ${lesson.lesson} 課</span>
     <span class="name-part">《${lesson.name}》</span>`;
  document.getElementById('char-grid').innerHTML =
    lesson.chars.map((c, i) => `<div class="char-item" onclick="showChar(${i})">${c}</div>`).join('');
  switchView('chars-view');
}

function backToChars() {
  if (state.lesson && state.chars.length > 1) switchView('chars-view');
  else switchView('browse-view');
}

function showChar(idx) {
  if (idx !== undefined) state.charIdx = idx;
  const ch = state.chars[state.charIdx];
  const info = state.lesson
    ? `《${state.lesson.name}》<span class="idx"> · 第 ${state.charIdx+1} / ${state.chars.length} 字</span>`
    : `查詢字`;
  document.getElementById('char-info').innerHTML = info;
  document.getElementById('char-zhuyin-display').innerHTML =
    ZHUYIN[ch] ? `<span class="label">注音</span>${ZHUYIN[ch]}` : '';

  document.getElementById('prev-btn').disabled = state.charIdx <= 0;
  document.getElementById('next-btn').disabled = state.charIdx >= state.chars.length - 1;

  const target = document.getElementById('writer-target');
  target.innerHTML = '';
  try {
    state.writer = HanziWriter.create('writer-target', ch, {
      width: 320, height: 320, padding: 10,
      strokeAnimationSpeed: 1.2, delayBetweenStrokes: 180,
      strokeColor: '#2B2620', radicalColor: '#B23A2F',
      drawingColor: '#3F5B89', outlineColor: '#E8E2D5',
      showCharacter: true, showOutline: true,
      charDataLoader: (c, onC, onE) => {
        loadCharData(c, onC, e => {
          onE && onE({message: `找不到「${c}」的筆順資料`});
          target.innerHTML = `<div class="error-msg">找不到「${c}」的筆順資料<br><small>字庫涵蓋 9,000+ 個常用繁體字</small></div>`;
        });
      }
    });
  } catch(e) {
    target.innerHTML = `<div class="error-msg">載入失敗:${e.message}</div>`;
  }
  switchView('char-view');
}

function resetChar() { showChar(); }
function playAnimation() {
  if (state.writer) { state.writer.showCharacter(); setTimeout(()=>state.writer.animateCharacter(),100); }
}
function startQuiz() {
  if (state.writer) {
    state.writer.cancelQuiz && state.writer.cancelQuiz();
    state.writer.hideCharacter();
    state.writer.quiz({
      showHintAfterMisses: 3,
      onComplete: () => flashCelebration('太 棒 了')
    });
  }
}
function prevChar() { if (state.charIdx > 0) { state.charIdx--; showChar(); } }
function nextChar() { if (state.charIdx < state.chars.length - 1) { state.charIdx++; showChar(); } }

function searchChar() {
  const v = document.getElementById('search-input').value.trim();
  if (!v) return;
  const ch = v[0];
  if (!(ch >= '一' && ch <= '鿿')) { alert('請輸入一個中文字'); return; }
  state.chars = [ch]; state.charIdx = 0; state.lesson = null;
  showChar(0);
}

function switchMode(mode) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('mode-browse').style.display = mode === 'browse' ? 'block' : 'none';
  document.getElementById('mode-game').style.display = mode === 'game' ? 'block' : 'none';
}
function switchView(id) {
  const parent = document.getElementById(id).parentElement;
  parent.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function initGame() {
  const pubs = Object.keys(DATA);
  state.game.pubs = new Set(pubs);
  document.getElementById('g-pub-buttons').innerHTML =
    `<button class="btn g-pub-btn active" data-pub="__all__">全部</button>` +
    pubs.map(p => `<button class="btn g-pub-btn active" data-pub="${p}">${p}</button>`).join('');
  document.querySelectorAll('.g-pub-btn').forEach(b => {
    b.onclick = () => toggleGamePub(b.dataset.pub, b);
  });

  const allGrades = new Set();
  pubs.forEach(p => Object.keys(DATA[p]).forEach(g => allGrades.add(g)));
  const gradeList = sortGrades(Array.from(allGrades));
  state.game.grades = new Set(gradeList);
  document.getElementById('g-grade-buttons').innerHTML =
    `<button class="btn g-grade-btn active" data-g="__all__">全部</button>` +
    gradeList.map(g => `<button class="btn g-grade-btn active" data-g="${g}">${g}</button>`).join('');
  document.querySelectorAll('.g-grade-btn').forEach(b => {
    b.onclick = () => toggleGameGrade(b.dataset.g, b);
  });

  document.getElementById('g-lesson-buttons').innerHTML = `
    <button class="btn g-lesson-btn active" data-f="all">全部課別</button>
    <button class="btn g-lesson-btn" data-f="first">只取第 1~5 課</button>
    <button class="btn g-lesson-btn" data-f="last">只取第 6 課以後</button>
  `;
  document.querySelectorAll('.g-lesson-btn').forEach(b => {
    b.onclick = () => {
      state.game.lessonFilter = b.dataset.f;
      document.querySelectorAll('.g-lesson-btn').forEach(x => x.classList.toggle('active', x === b));
      updatePoolInfo();
    };
  });

  document.querySelectorAll('.count-btn').forEach(b => {
    b.onclick = () => {
      state.game.count = parseInt(b.dataset.count);
      document.querySelectorAll('.count-btn').forEach(x => x.classList.toggle('active', x === b));
      updatePoolInfo();
    };
  });

  updatePoolInfo();
}

function toggleGamePub(pub, btn) {
  if (pub === '__all__') {
    const allPubs = Object.keys(DATA);
    state.game.pubs = new Set(allPubs);
    document.querySelectorAll('.g-pub-btn').forEach(x => x.classList.add('active'));
  } else {
    const allBtn = document.querySelector('.g-pub-btn[data-pub="__all__"]');
    if (state.game.pubs.has(pub)) { state.game.pubs.delete(pub); btn.classList.remove('active'); }
    else { state.game.pubs.add(pub); btn.classList.add('active'); }
    const allOn = Object.keys(DATA).every(p => state.game.pubs.has(p));
    allBtn.classList.toggle('active', allOn);
  }
  updatePoolInfo();
}

function toggleGameGrade(g, btn) {
  const allGrades = sortGrades(Array.from(new Set(Object.keys(DATA).flatMap(p => Object.keys(DATA[p])))));
  if (g === '__all__') {
    state.game.grades = new Set(allGrades);
    document.querySelectorAll('.g-grade-btn').forEach(x => x.classList.add('active'));
  } else {
    const allBtn = document.querySelector('.g-grade-btn[data-g="__all__"]');
    if (state.game.grades.has(g)) { state.game.grades.delete(g); btn.classList.remove('active'); }
    else { state.game.grades.add(g); btn.classList.add('active'); }
    const allOn = allGrades.every(x => state.game.grades.has(x));
    allBtn.classList.toggle('active', allOn);
  }
  updatePoolInfo();
}

function getGamePool() {
  const pool = new Set();
  for (const pub of state.game.pubs) {
    if (!DATA[pub]) continue;
    for (const g of Object.keys(DATA[pub])) {
      if (!state.game.grades.has(g)) continue;
      for (const lesson of DATA[pub][g]) {
        if (state.game.lessonFilter === 'first' && lesson.lesson > 5) continue;
        if (state.game.lessonFilter === 'last' && lesson.lesson <= 5) continue;
        for (const ch of lesson.chars) pool.add(ch);
      }
    }
  }
  return Array.from(pool);
}

function updatePoolInfo() {
  const pool = getGamePool();
  document.getElementById('g-pool-count').textContent = pool.length;
  const btn = document.getElementById('g-start-btn');
  btn.disabled = pool.length < 1;
  if (pool.length < state.game.count) {
    btn.textContent = pool.length > 0 ? `開始(只有 ${pool.length} 題可出)` : '沒有符合條件的字';
  } else {
    btn.textContent = `開始闖關 · ${state.game.count} 題`;
  }
}

function startGame() {
  const pool = getGamePool();
  if (pool.length === 0) return;
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  const n = Math.min(state.game.count, pool.length);
  state.game.queue = shuffled.slice(0, n);
  state.game.results = [];
  state.game.curIdx = 0;
  document.getElementById('g-total').textContent = n;
  showGameQuestion();
  switchView('game-play-view');
}

function updateGameProgress() {
  const total = state.game.queue.length;
  const pct = total > 0 ? (state.game.curIdx / total) * 100 : 0;
  document.getElementById('g-progress-fill').style.width = pct + '%';
}

function showGameQuestion() {
  const ch = state.game.queue[state.game.curIdx];
  state.game.mistakes = 0;
  state.game.revealed = false;
  document.getElementById('g-current').textContent = state.game.curIdx + 1;
  document.getElementById('g-score').textContent =
    state.game.results.filter(r => r.ok && !r.peeked).length;
  document.getElementById('g-zhuyin').textContent = ZHUYIN[ch] || '(無注音)';
  updateGameProgress();

  const target = document.getElementById('game-writer-target');
  target.innerHTML = '';
  try {
    state.game.writer = HanziWriter.create('game-writer-target', ch, {
      width: 320, height: 320, padding: 10,
      strokeAnimationSpeed: 1.0, delayBetweenStrokes: 150,
      strokeColor: '#2B2620', radicalColor: '#B23A2F',
      drawingColor: '#5F8463', outlineColor: '#E8E2D5',
      showCharacter: false, showOutline: true,
      charDataLoader: (c, onC, onE) => {
        loadCharData(c, onC, e => {
          onE && onE({message: 'not found'});
          state.game.results.push({ch:c, ok:false, skip:true, notfound:true});
          setTimeout(nextGameQuestion, 300);
          target.innerHTML = `<div class="error-msg">「${c}」沒有筆順資料,自動跳過</div>`;
        });
      },
      onLoadCharDataSuccess: () => {
        state.game.writer.quiz({
          showHintAfterMisses: 3,
          onMistake: info => { state.game.mistakes = info.totalMistakes; },
          onComplete: info => {
            const perfect = info.totalMistakes === 0;
            state.game.results.push({ ch, ok: true, skip: false, mistakes: info.totalMistakes });
            flashCelebration(perfect ? '一 次 通 過' : '答 對 了');
            setTimeout(nextGameQuestion, 900);
          }
        });
      }
    });
  } catch(e) {
    target.innerHTML = `<div class="error-msg">載入失敗</div>`;
  }
}

function peekAnswer() {
  if (state.game.writer) {
    state.game.writer.cancelQuiz && state.game.writer.cancelQuiz();
    state.game.writer.showCharacter();
    state.game.revealed = true;
    setTimeout(() => {
      state.game.writer.hideCharacter();
      state.game.writer.quiz({
        showHintAfterMisses: 3,
        onComplete: () => {
          state.game.results.push({ ch: state.game.queue[state.game.curIdx], ok: true, skip: false, peeked: true });
          flashCelebration('完 成');
          setTimeout(nextGameQuestion, 700);
        }
      });
    }, 2500);
  }
}

function skipQuestion() {
  if (!confirm('確定跳過這一題嗎?')) return;
  state.game.writer && state.game.writer.cancelQuiz && state.game.writer.cancelQuiz();
  state.game.results.push({ ch: state.game.queue[state.game.curIdx], ok: false, skip: true });
  nextGameQuestion();
}

function nextGameQuestion() {
  state.game.curIdx++;
  if (state.game.curIdx >= state.game.queue.length) {
    updateGameProgress();
    document.getElementById('g-progress-fill').style.width = '100%';
    showGameResult();
  } else {
    showGameQuestion();
  }
}

function showGameResult() {
  const results = state.game.results;
  const correct = results.filter(r => r.ok && !r.peeked).length;
  const peeked = results.filter(r => r.peeked).length;
  const wrong = results.filter(r => !r.ok).length;
  const total = results.length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;

  // 以傳統評等印章顯示結果
  let sealCls, sealChar, title;
  if (pct === 100)     { sealCls = 'seal-top';       sealChar = '甲'; title = '滿分 · 一等'; }
  else if (pct >= 80)  { sealCls = 'seal-excellent'; sealChar = '優'; title = '表現優異'; }
  else if (pct >= 60)  { sealCls = 'seal-good';      sealChar = '良'; title = '成績良好'; }
  else if (pct >= 40)  { sealCls = 'seal-ok';        sealChar = '可'; title = '繼續加油'; }
  else                 { sealCls = 'seal-practice';  sealChar = '勤'; title = '多多練習'; }

  const seal = document.getElementById('g-seal');
  seal.className = 'result-seal ' + sealCls;
  document.getElementById('g-seal-char').textContent = sealChar;
  document.getElementById('g-result-title').textContent = title;
  document.getElementById('g-correct').textContent = correct;
  document.getElementById('g-of').textContent = total;
  let pctText = `答對率 ${pct}%`;
  if (peeked > 0) pctText += `   看答案 ${peeked} 題`;
  if (wrong > 0) pctText += `   跳過 ${wrong} 題`;
  document.getElementById('g-percentage').textContent = pctText;

  document.getElementById('g-result-list').innerHTML = results.map(r => {
    let cls, badge;
    if (r.peeked) { cls = 'skip'; badge = '助'; }        // 看過答案
    else if (r.ok) { cls = 'ok'; badge = r.mistakes === 0 ? '甲' : '通'; } // 完美 / 通過
    else { cls = 'wrong'; badge = '過'; }                 // 跳過
    return `<div class="result-item ${cls}">${r.ch}<span class="badge">${badge}</span></div>`;
  }).join('');

  switchView('game-result-view');
}

function restartGame() { startGame(); }
function backToSetup() { switchView('game-setup-view'); updatePoolInfo(); }

function flashCelebration(text) {
  const el = document.getElementById('celebration');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

initBrowse();
initGame();
</script>
</body>
</html>
